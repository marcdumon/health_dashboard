[project]
name = 'health-dashboard'
version = '0.2.4'
description = 'A personal health dashboard: supplements, angina, ketones and tape measurements, the Withings blood pressure and scale, the Polar H10 sessions and tests, the sleep of Sleep as Android and the Fitbit data of Google Health.'
readme = 'README.md'
authors = [{ name = 'Marc Dumon', email = '7793950+marcdumon@users.noreply.github.com' }]
requires-python = '>=3.13'
dependencies = [
    "fastapi>=0.141.1",
    "google-api @ git+https://github.com/marcdumon/google_api@v0.1.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
health-dashboard = 'health_dashboard.api:main'

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "respx>=0.23.1",
    "ruff>=0.16.8",
]

[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[tool.hatch.build.targets.wheel]
packages = ['src/health_dashboard']

[tool.hatch.build.targets.wheel.hooks.custom]
path = 'hatch_build.py'

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ['tests']
addopts = '-q --tb=short'

[tool.ruff]
line-length = 135

[tool.ruff.lint]
select = ['E', 'F', 'I', 'B', 'UP', 'SIM', 'RUF']

[tool.ruff.format]
quote-style = 'single'

[tool.uv.sources]
google-api = { path = "../google_api", editable = true }
